<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lunar Plan B</title>
<meta name="description" content="Compare two landing plans for the lunar south pole: sunlight and contact with Earth over the real terrain.">
<style>
  :root { --text: #d8d8d8; --dim: #8a8a8a; --line: #2a2a2a; --sun: #f2c94c; --earth: #6aa9ff; }
  html { background: #000; color: var(--text); }
  body { margin: 0 auto; padding: 24px 16px 48px; max-width: 640px;
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  p { margin: 0 0 16px; }
  .dim { color: var(--dim); }
  table { width: 100%; border-collapse: collapse; margin: 0 0 16px; }
  caption { text-align: left; padding: 0 0 8px; }
  th, td { text-align: left; vertical-align: top; padding: 8px 0; border-top: 1px solid var(--line); font-weight: 400; }
  td { text-align: right; white-space: nowrap; padding-left: 16px; font-variant-numeric: tabular-nums; }
  .sun td { color: var(--sun); }
  .earth td { color: var(--earth); }
  a { color: inherit; }
  small { font-size: 13px; }
</style>
</head>
<body>
<h1>Lunar Plan B</h1>
<p class="dim">Sunlight and contact with Earth for a landing plan at the Moon's south pole.</p>
<p id="status" role="status">Loading sky data</p>
<main id="plan"></main>
<script type="module" src="js/app.js"></script>
</body>
</html>
